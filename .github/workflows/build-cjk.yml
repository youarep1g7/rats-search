name: Build Windows x64 (CJK)

on:
  workflow_dispatch:
  push:
    branches: [ cjk-search ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6.10.1 (msvc2022_64) + WebSockets
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebsockets'
          cache: false

      - name: Setup CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Activate MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$Qt6_DIR/../../.." -DRATS_SEARCH_BUILD_TESTS=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Deploy Qt runtime (windeployqt) + copy MySQL driver
        shell: bash
        run: |
          QT_DIR_BIN=$(dirname "$Qt6_DIR")
          echo "Qt6_DIR=$Qt6_DIR  bin=$QT_DIR_BIN"
          "$QT_DIR_BIN/windeployqt.exe" --release --no-translations --no-opengl-sw build/bin/RatsSearch.exe
          cp "$QT_DIR_BIN/../plugins/sqldrivers/qsqlmysql.dll" build/bin/sqldrivers/ 2>&1 || { echo "qsqlmysql copy failed, listing plugins:"; ls -la "$QT_DIR_BIN/../plugins/sqldrivers/" 2>&1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RatsSearch-Windows-x64-CJK
          path: build/bin/
